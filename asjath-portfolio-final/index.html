<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary -->
    <title>Asjath Mubeen — Full-Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Asjath Mubeen, an IT undergraduate and aspiring full-stack developer. Projects, skills, and contact — MERN, PHP/Laravel, and modern web development."
    />
    <meta
      name="keywords"
      content="Asjath Mubeen, full-stack developer, portfolio, React, Node.js, MERN, PHP, Laravel, web developer, Sri Lanka"
    />
    <meta name="author" content="Asjath Mubeen" />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark" />

    <!--
      Canonical URL — replace YOUR_DOMAIN with your live origin (no trailing path).
      Example: https://asjathmubeen.dev
    -->
    <link rel="canonical" href="https://YOUR_DOMAIN/" />

    <!-- Robots: allow indexing of the main portfolio -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Asjath Mubeen" />
    <meta property="og:title" content="Asjath Mubeen — Full-Stack Developer" />
    <meta
      property="og:description"
      content="IT undergraduate and aspiring full-stack developer. Selected projects, skills, and ways to get in touch."
    />
    <meta property="og:url" content="https://YOUR_DOMAIN/" />
    <!-- Optional: add public/og-image.png (~1200×630) then uncomment:
    <meta property="og:image" content="https://YOUR_DOMAIN/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Asjath Mubeen — Full-Stack Developer" />
    -->

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Asjath Mubeen — Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="IT undergraduate and aspiring full-stack developer. Projects, skills, and contact."
    />
    <!-- Optional when og-image exists:
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://YOUR_DOMAIN/og-image.png" />
    -->
